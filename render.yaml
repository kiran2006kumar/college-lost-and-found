services:
  - type: web
    name: lostlink-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: lostlink-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lostlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: lostlink-frontend
          type: web
          property: host
      - key: UPLOAD_DIR
        value: /var/data/uploads

  - type: web
    name: lostlink-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: lostlink-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: lostlink-db
    databaseName: lostlink
    user: lostlink
    plan: 0.5c-1g
    region: singapore
